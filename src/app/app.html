<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:absolute focus:left-4 focus:top-4 focus:z-50 focus:rounded focus:bg-slate-900 focus:px-4 focus:py-2 focus:text-white"
>
  Skip to main content
</a>

<div class="flex min-h-screen flex-col bg-white text-slate-900">
  <header class="border-b border-slate-200">
    <nav
      class="mx-auto flex max-w-4xl items-center justify-between gap-4 px-4 py-4"
      aria-label="Main"
    >
      <a routerLink="/" class="text-base font-bold tracking-tight text-slate-900">
        AI Code Review Assistant
      </a>
      <ul class="flex items-center gap-5 text-sm">
        <li>
          <a
            routerLink="/"
            routerLinkActive="font-semibold underline underline-offset-4"
            [routerLinkActiveOptions]="{ exact: true }"
            class="text-slate-700 hover:text-slate-900"
          >
            Home
          </a>
        </li>
        <li>
          <a
            routerLink="/review"
            routerLinkActive="font-semibold underline underline-offset-4"
            class="text-slate-700 hover:text-slate-900"
          >
            Review
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main id="main-content" class="flex-1">
    <router-outlet />
  </main>

  <footer class="border-t border-slate-200 py-6">
    <p class="mx-auto max-w-4xl px-4 text-xs text-slate-500">
      Scores are a structured code-quality aid, not a judgement of developer ability.
    </p>
  </footer>
</div>
